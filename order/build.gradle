dependencies {
    // 컨텍스트 간 유일한 공유 = shared 통합 이벤트 계약(C-3). application 포트가 이를 발행 인자로 받는다.
    api project(":shared")

    // BOM(platform): 아래 의존성 버전을 Spring Boot 가 일괄 관리(개별 버전 명시 X).
    implementation platform(libs.spring.boot.dependencies)

    // application 계층: 트랜잭션 추상(@Transactional)만.
    implementation libs.spring.tx

    // infrastructure 계층: 인바운드(REST) · 아웃바운드 어댑터.
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.validation
    runtimeOnly libs.mysql.connector

    // Retry
    implementation "org.springframework.retry:spring-retry"

    // 레디스 (Redisson 사용)
    implementation libs.redisson.spring.boot.starter

    // shedlock
    implementation libs.shedlock.spring

    // flyway
    implementation libs.flyway.core
    implementation libs.flyway.mysql

    // --- test ---
    // 멱등키 aspect 검증이 외부 컨테이너 상태에 의존하지 않게 테스트가 자기 Redis 를 직접 띄운다.
    testImplementation libs.testcontainers.junit.jupiter
    // TTL 이 실제로 만료될 때까지 폴링하며 기다린다. 버전은 Boot BOM 이 관리한다.
    testImplementation "org.awaitility:awaitility"
    // h2
    testRuntimeOnly "com.h2database:h2"
}
