spring:
  application:
    name: order-platform

  profiles:
    default: local

idempotent:
  # 멱등키 보관 기간. 이 시간 안에 들어온 동일 키는 중복 요청으로 간주한다.
  ttl: 1m

inventory:
  lock-strategy: pessimistic # optimistic, pessimistic, distributed 중 하나 선택

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080