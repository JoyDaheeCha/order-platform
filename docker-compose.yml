# docker-compose.yml — 로컬 개발 인프라(MySQL · Kafka · Redis) + 부속 컨테이너(kafka-init · kafka-ui).
#
# 이 프로젝트는 "모듈러 모노리스 + 컨텍스트별 스키마 격리"다(ADR-0004 A-2).
# 그래서 **MySQL 인스턴스는 하나**고, 격리는 인스턴스가 아니라 스키마로 한다.
#   · DB 인스턴스 분리는 단계 3개짜리 학습 범위엔 오버스펙이라 의식적으로 뺐다(design.md §5).
#
# 사용법:
#   docker compose up -d      # 기동
#   docker compose ps         # 헬스체크 상태 확인 (mysql · kafka · redis 3개가 healthy 여야 함)
#                             #   kafka-init 은 Exit 0, kafka-ui 는 Up 으로 보이는 게 정상
#   docker compose down       # 정지 (데이터 유지)
#   docker compose down -v    # 정지 + 볼륨 삭제 (스키마 init SQL을 다시 돌리고 싶을 때)

services:
  mysql:
    image: mysql:8.0
    container_name: order-platform-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root      # 학습용. 운영이라면 절대 이렇게 두지 않는다.
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' order_schema >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    container_name: order-platform-kafka
    ports:
      - "19092:19092"
    environment:
      # --- KRaft 정체성 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # 단일 노드가 둘 다 겸직 (학습용. 운영은 분리 권장)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # Raft 투표자 = 자기 자신 하나
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 클러스터 식별자. 고정해 두면 볼륨을 지우고 다시 떠도 같은 클러스터로 포맷된다.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

      # --- 리스너 ---
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT   # 브로커끼리 쓰는 리스너(단일 노드라 실질 의미는 적다)

      # --- 단일 노드용 조정 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 컨슈머 그룹이 뜰 때 "다른 멤버도 들어오나" 기다리는 시간. 개발 중엔 0이 편하다(리밸런스 즉시).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
  # Kafka 웹 콘솔 — 토픽/메시지/컨슈머 그룹 랙을 눈으로 확인하는 용도.
  #
  # 이미지: kafbat/kafka-ui
  #   · 원조 provectuslabs/kafka-ui 는 2024년 이후 유지보수가 멈췄고,
  #     원 메인테이너들이 kafbat 조직으로 옮겨 이어가고 있다. 신규 구성은 이쪽이 표준.
  #   · `latest` 대신 버전을 고정한다. 로컬 인프라가 어느 날 갑자기 바뀌면
  #     "내 코드 문제인지 인프라 문제인지" 구분이 안 되기 때문(mysql:8.0, kafka:3.9.0 과 같은 정책).
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: order-platform-kafka-ui
    ports:
      # 컨테이너는 8080 이지만 호스트는 18080 으로 뺀다.
      # 앱(bootstrap)이 server.port=8080 을 쓰고 있어서 그대로 두면 포트가 충돌한다.
      # 다른 인프라와 같은 규칙(호스트 포트 = 1 + 원래 포트: 13306 / 19092 / 16379).
      - "18080:8080"
    environment:
      # UI 좌측에 표시될 클러스터 이름.
      KAFKA_CLUSTERS_0_NAME: local-cluster
      # 컨테이너끼리는 같은 compose 네트워크 안에 있으므로 서비스명:내부포트로 붙는다.
      # localhost:19092 가 아니다 — 19092(PLAINTEXT_HOST)는 호스트 머신에서 붙을 때 쓰는 리스너다.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # UI에서 클러스터 설정을 추가/수정할 수 있게 한다.
      # 변경분은 컨테이너 안에만 남아서 재생성하면 사라진다(로컬 실습용이라 이대로 둔다).
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy   # 브로커가 뜨기 전에 붙으면 UI가 빈 클러스터로 보인다

  # 토픽 생성 전용 일회성 컨테이너.
  #
  # 브로커가 auto.create.topics.enable=false 라서 토픽은 **누군가 명시적으로** 만들어야 한다.
  #   · 자동 생성을 켜면 토픽명 오타가 나도 조용히 새 토픽이 생겨서
  #     "발행은 됐는데 컨슈머가 못 받는" 디버깅하기 나쁜 상황이 만들어진다.
  #     지금처럼 즉시 실패하는 편이 안전하다.
  #   · 운영이라면 이 역할은 IaC/운영팀이 맡는다. 여기선 로컬 편의를 위해 컴포즈가 대신한다.
  #
  # 1회 실행 후 Exit 0 으로 종료된 채 남는 게 정상이다(restart: "no").
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: order-platform-kafka-init
    depends_on:
      kafka:
        condition: service_healthy   # 브로커 healthcheck 통과 후에만 실행
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      # $$TOPIC 의 `$$` — 컴포즈가 `$VAR` 를 자기 변수로 먼저 치환해버리므로 셸에 넘기려면 이스케이프해야 한다.
      # --if-not-exists 라서 `docker compose up` 을 반복해도 안전하다(멱등).
      - |
        set -e
        for TOPIC in \
          MSG-ORDER-CREATED \
          MSG-ORDER-PAYMENT-PREPARED \
          MSG-ORDER-PAID \
          MSG-ORDER-FAILED \
          MSG-ORDER-CANCELLED \
          MSG-PAYMENT-COMPLETED \
          MSG-PAYMENT-FAILED \
          MSG-INVENTORY-RESERVED \
          MSG-INVENTORY-RESERVATION-FAILED \
          MSG-INVENTORY-DECREASED \
          MSG-INVENTORY-SHORTAGE \
          MSG-INVENTORY-RESTORED ; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$TOPIC" \
            --partitions 3 --replication-factor 1
        done
        echo "--- 생성된 토픽 ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  redis:
    image: redis:7-alpine
    container_name: order-platform-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# 명명 볼륨(named volume) — 컨테이너를 지워도 데이터가 남는다.
# 초기화하려면 `docker compose down -v`.
volumes:
  mysql-data:
  kafka-data:
  redis-data:
